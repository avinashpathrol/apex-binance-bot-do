<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Apex Command — Calendar</title>
<script>
(function(){
  function isDesktopLike(){
    try{ return !window.matchMedia('(pointer: coarse)').matches && window.innerWidth >= 1024; }
    catch(e){ return window.innerWidth >= 1024; }
  }
  var pref = null; try{ pref = localStorage.getItem('apex_view_pref'); }catch(e){}
  if(pref !== 'desktop' && !isDesktopLike()){
    location.replace('index.html');
  }
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#0a0c11; --panel:#12151d; --panel2:#0f121a; --border:#1e222c; --border2:#242833; --text:#e7e9ee; --muted:#6b7280; --dim:#3f4451; --teal:#2dd4bf; --teal2:#0891b2; --green:#4ade80; --red:#f87171; --amber:#f59e0b; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);font-family:'Manrope',sans-serif;color:var(--text);min-width:1180px}
  a{color:var(--teal);text-decoration:none} a:hover{color:#5eead4}
  .mono{font-family:'JetBrains Mono',monospace}
  .head{font-family:'Space Grotesk',sans-serif}
  .page{display:flex;flex-direction:column;min-height:100vh}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 28px;border-bottom:1px solid var(--border);background:rgba(13,15,21,.85)}
  .brand{display:flex;align-items:center;gap:12px}
  .brand-mark{width:32px;height:32px;border-radius:10px;background:radial-gradient(circle at 30% 30%,#5eead4,#0891b2 60%,#164e63);display:flex;align-items:center;justify-content:center;box-shadow:0 0 20px rgba(45,212,191,.3)}
  .brand-name{font-size:16px;font-weight:700}
  .brand-sub{font-size:11px;color:var(--muted);margin-top:1px}
  .body-row{display:flex;flex-grow:1;align-items:flex-start}
  .rail{width:60px;flex-shrink:0;align-self:stretch;border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;gap:8px;padding-top:18px;background:#0d0f16}
  .rail a{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center}
  .rail a.active{background:rgba(45,212,191,.12);border:1px solid rgba(45,212,191,.3)}
  .main{flex-grow:1;padding:24px 28px 40px;max-width:1000px}
  .tabs{display:flex;gap:8px;margin-bottom:18px}
  .tab-btn{padding:8px 16px;border-radius:9px;border:1px solid var(--border2);background:var(--panel);color:var(--muted);font-size:12.5px;font-weight:600;font-family:inherit;cursor:pointer}
  .tab-btn.active{border-color:rgba(45,212,191,.4);background:rgba(45,212,191,.1);color:var(--teal)}
  .nav-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .nav-btn{width:32px;height:32px;border-radius:8px;border:1px solid var(--border2);background:var(--panel);color:var(--text);cursor:pointer;font-size:14px}
  .month-label{font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:600}
  .stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}
  .stat-card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:14px 16px}
  .stat-label{font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
  .stat-value{font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:600;margin-top:6px}
  .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .dow{font-size:10.5px;color:var(--muted);text-align:center;padding-bottom:6px}
  .day{background:var(--panel2);border-radius:10px;padding:8px;min-height:72px;font-size:11px;cursor:default}
  .day.has{cursor:pointer}
  .day.has:hover{outline:1px solid var(--border2)}
  .day.today{outline:1px solid var(--teal)}
  .day.profit{background:rgba(74,222,128,.08)}
  .day.loss{background:rgba(248,113,113,.08)}
  .day.empty{background:transparent}
  .day-num{color:var(--muted);font-size:11px}
  .day-pnl{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600;margin-top:4px}
  .day-cnt{color:var(--muted);font-size:10px;margin-top:2px}
  .detail{margin-top:18px;background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:16px;display:none}
  .detail-row{display:grid;grid-template-columns:1fr 1.6fr .8fr;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);font-size:12.5px}
  .detail-row:last-child{border-bottom:none}
  .empty-msg{color:var(--dim);font-size:13px;padding:20px;text-align:center}
</style>
</head>
<body>
<div class="page">
  <div class="topbar">
    <div class="brand">
      <div class="brand-mark"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#04121a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg></div>
      <div><div class="brand-name head">Apex Command</div><div class="brand-sub">P&amp;L Calendar</div></div>
    </div>
    <a href="command.html">← Back to dashboard</a>
  </div>
  <div class="body-row">
    <div class="rail">
      <a href="command.html" title="Dashboard"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#6b7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg></a>
      <a class="active" href="command-calendar.html" title="P&amp;L Calendar"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#2dd4bf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></a>
    </div>
    <div class="main">
      <div class="tabs" id="tabs"></div>
      <div class="stat-row">
        <div class="stat-card"><div class="stat-label">Today</div><div class="stat-value" id="stat-today">—</div></div>
        <div class="stat-card"><div class="stat-label">This Week</div><div class="stat-value" id="stat-week">—</div></div>
        <div class="stat-card"><div class="stat-label" id="stat-month-label">This Month</div><div class="stat-value" id="stat-month">—</div></div>
      </div>
      <div class="nav-row">
        <button class="nav-btn" onclick="prevMonth()">‹</button>
        <div class="month-label" id="month-label">—</div>
        <button class="nav-btn" onclick="nextMonth()">›</button>
      </div>
      <div class="grid" id="dow-row"></div>
      <div class="grid" id="cal-grid" style="margin-top:6px"></div>
      <div class="detail" id="detail">
        <div class="head" style="font-size:14px;font-weight:600;margin-bottom:10px" id="detail-title">—</div>
        <div id="detail-rows"></div>
      </div>
    </div>
  </div>
</div>

<script>
const SOURCES = {
  apex:   {label:'Apex Futures',  api:'/trades_log.json',        mode:'flat'},
  mu:     {label:'MU Overnight',  api:'/data_overnight_mu.json', mode:'mu'},
  spy:    {label:'SPY 0DTE',      api:'/spy_state.json',         mode:'spy'},
  crypto: {label:'Crypto Paper',  api:'/data_crypto0dte.json',   mode:'crypto'},
};
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

let activeSource = new URLSearchParams(location.search).get('source') || 'apex';
if(!SOURCES[activeSource]) activeSource = 'apex';
let allTrades = {};  // cache per source
let now = new Date();
let calYear = now.getFullYear(), calMonth = now.getMonth();

const qs = (s,el=document)=>el.querySelector(s);
const n  = (v,d=0)=>{const f=parseFloat(v);return isNaN(f)?d:f};
const esc = s => String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function dayKey(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fmt(v){ const x=n(v); return (x>=0?'+':'')+x.toFixed(2); }

function renderTabs(){
  qs('#tabs').innerHTML = Object.keys(SOURCES).map(k=>
    `<button class="tab-btn ${k===activeSource?'active':''}" onclick="switchSource('${k}')">${SOURCES[k].label}</button>`
  ).join('');
}
async function switchSource(key){
  activeSource = key;
  renderTabs();
  qs('#detail').style.display = 'none';
  await loadSource(key);
  renderAll();
}

async function fetchJson(url){
  try{ const r = await fetch(url+'?t='+Date.now(), {cache:'no-store'}); return r.ok ? await r.json() : null; }
  catch(e){ return null; }
}

function normalize(mode, raw){
  if(!raw) return [];
  if(mode === 'flat') return (raw||[]).map(t=>({
    date: t.closed_at || t.opened_at, pnl: n(t.pnl), win: !!(t.win || t.pnl > 0),
    label: (t.symbol||'').replace('USDT',''), detail: `${n(t.entry_price).toFixed(2)} → ${n(t.exit_price).toFixed(2)}`, note: t.note || t.side || '',
  }));
  if(mode === 'mu') return (raw.trades||[]).map(t=>({
    date: t.closed_at, pnl: n(t.net), win: n(t.net) > 0,
    label: 'MU', detail: `$${n(t.entry_price).toFixed(2)} → $${n(t.exit_price).toFixed(2)}`, note: t.reason || '',
  }));
  if(mode === 'spy') return (raw.trades||[]).filter(t=>t.status==='closed').map(t=>({
    date: t.closed_at, pnl: n(t.pnl), win: n(t.pnl) > 0,
    label: 'SPY', detail: `${t.short_strike}/${t.long_strike} ${esc(t.direction||'')}`, note: t.profit_pct!=null ? t.profit_pct.toFixed(0)+'%' : '',
  }));
  if(mode === 'crypto'){
    const out = [];
    Object.keys(raw.symbols||{}).forEach(sym=>{
      (raw.symbols[sym].trades||[]).forEach(t=>{
        out.push({date: t.closed_at, pnl: n(t.pnl), win: !!t.win, label: sym, detail: esc(t.direction||''), note: t.settle_price ? 'settle $'+n(t.settle_price).toFixed(2) : ''});
      });
    });
    return out;
  }
  return [];
}

async function loadSource(key){
  if(allTrades[key]) return;
  const src = SOURCES[key];
  const raw = await fetchJson(src.api);
  allTrades[key] = normalize(src.mode, raw);
}

function currentTrades(){ return allTrades[activeSource] || []; }

function renderStats(){
  const trades = currentTrades();
  const today = dayKey(new Date());
  const weekAgo = Date.now() - 7*86400*1000;
  const monthPrefix = calYear + '-' + String(calMonth+1).padStart(2,'0') + '-';

  const todayTrades = trades.filter(t=>t.date && dayKey(new Date(t.date))===today);
  const weekTrades = trades.filter(t=>t.date && new Date(t.date).getTime()>=weekAgo);
  const monthTrades = trades.filter(t=>t.date && dayKey(new Date(t.date)).startsWith(monthPrefix));

  const sum = arr => arr.reduce((s,t)=>s+t.pnl,0);
  const set = (id, val) => { const el = qs(id); el.textContent = fmt(val); el.style.color = val>=0?'var(--green)':'var(--red)'; };
  set('#stat-today', sum(todayTrades));
  set('#stat-week', sum(weekTrades));
  set('#stat-month', sum(monthTrades));
  qs('#stat-month-label').textContent = MONTHS[calMonth];
}

function renderGrid(){
  qs('#month-label').textContent = MONTHS[calMonth]+' '+calYear;
  qs('#dow-row').innerHTML = DOW.map(d=>`<div class="dow">${d}</div>`).join('');

  const trades = currentTrades();
  const byDay = {};
  trades.forEach(t=>{
    if(!t.date) return;
    const k = dayKey(new Date(t.date));
    (byDay[k] = byDay[k] || []).push(t);
  });

  const today = dayKey(new Date());
  const firstDow = new Date(calYear, calMonth, 1).getDay();
  const daysInMonth = new Date(calYear, calMonth+1, 0).getDate();

  let html = '';
  for(let i=0;i<firstDow;i++) html += '<div class="day empty"></div>';
  for(let d=1; d<=daysInMonth; d++){
    const key = calYear+'-'+String(calMonth+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const dayTrades = byDay[key] || [];
    const net = dayTrades.reduce((s,t)=>s+t.pnl,0);
    let cls = 'day';
    if(dayTrades.length){ cls += ' has ' + (net>=0?'profit':'loss'); }
    if(key===today) cls += ' today';
    let inner = `<div class="day-num">${d}</div>`;
    if(dayTrades.length){
      inner += `<div class="day-pnl" style="color:${net>=0?'var(--green)':'var(--red)'}">${fmt(net)}</div>`;
      inner += `<div class="day-cnt">${dayTrades.length} trade${dayTrades.length>1?'s':''}</div>`;
    }
    const onclick = dayTrades.length ? `onclick="showDay('${key}')"` : '';
    html += `<div class="${cls}" ${onclick}>${inner}</div>`;
  }
  qs('#cal-grid').innerHTML = html;
}

function showDay(key){
  const trades = currentTrades().filter(t=>t.date && dayKey(new Date(t.date))===key);
  qs('#detail-title').textContent = key + ' — ' + SOURCES[activeSource].label + ' (' + trades.length + ' trade' + (trades.length>1?'s':'') + ')';
  qs('#detail-rows').innerHTML = trades.length ? trades.map(t=>{
    const color = t.pnl>=0 ? 'var(--green)' : 'var(--red)';
    return `<div class="detail-row"><span>${esc(t.label)}</span><span style="color:var(--muted)">${esc(t.detail)} ${t.note?'· '+esc(t.note):''}</span><span class="mono" style="color:${color}">${fmt(t.pnl)}</span></div>`;
  }).join('') : '<div class="empty-msg">No trades.</div>';
  qs('#detail').style.display = 'block';
}

function prevMonth(){ calMonth--; if(calMonth<0){calMonth=11;calYear--;} renderStats(); renderGrid(); qs('#detail').style.display='none'; }
function nextMonth(){ calMonth++; if(calMonth>11){calMonth=0;calYear++;} renderStats(); renderGrid(); qs('#detail').style.display='none'; }

function renderAll(){ renderStats(); renderGrid(); }

(async function init(){
  renderTabs();
  await loadSource(activeSource);
  renderAll();
})();
</script>
</body>
</html>
