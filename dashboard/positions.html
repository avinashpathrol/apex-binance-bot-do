<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Apex — Active Positions</title>
<style>
:root {
  --bg: #0f1117;
  --card: #1a1d27;
  --card2: #222635;
  --border: #2e3347;
  --text: #e8eaf0;
  --muted: #8b90a0;
  --green: #22c55e;
  --red: #ef4444;
  --amber: #f59e0b;
  --blue: #3b82f6;
  --accent: #6366f1;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
  min-height: 100vh;
  padding-top: env(safe-area-inset-top);
  padding-bottom: env(safe-area-inset-bottom);
}

/* ── Header ── */
.header {
  background: var(--card);
  border-bottom: 1px solid var(--border);
  padding: 14px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky; top: 0; z-index: 20;
}
.header-left { display: flex; align-items: center; gap: 10px; }
.header h1 { font-size: 18px; font-weight: 700; letter-spacing: -0.3px; }
.header-right { display: flex; align-items: center; gap: 10px; }
.header a { color: var(--muted); font-size: 13px; text-decoration: none; }
.header a:hover { color: var(--text); }
.live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); animation: blink 2s infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.35} }

/* ── Summary bar ── */
.summary {
  background: var(--card2);
  border-bottom: 1px solid var(--border);
  padding: 10px 16px;
  display: flex; gap: 20px; align-items: center;
  overflow-x: auto; -webkit-overflow-scrolling: touch;
}
.sum-item { display: flex; flex-direction: column; gap: 2px; white-space: nowrap; }
.sum-label { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
.sum-val { font-weight: 700; font-size: 16px; }

/* ── Refresh bar ── */
.refresh-row {
  padding: 6px 16px;
  display: flex; align-items: center; justify-content: space-between;
  font-size: 11px; color: var(--muted);
  border-bottom: 1px solid var(--border);
}
.refresh-row span { display: flex; align-items: center; gap: 6px; }
.price-badge {
  background: rgba(99,102,241,0.15); color: #818cf8;
  padding: 1px 6px; border-radius: 4px; font-size: 10px; font-weight: 700;
}

/* ── Grid ── */
.grid {
  padding: 10px 12px 100px;
  display: grid; grid-template-columns: 1fr; gap: 12px;
}
@media (min-width: 640px)  { .grid { grid-template-columns: 1fr 1fr; } }
@media (min-width: 1024px) { .grid { grid-template-columns: 1fr 1fr 1fr; } }

/* ── Card ── */
.pos-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  overflow: hidden;
}
.pos-card.long  { border-top: 3px solid var(--green); }
.pos-card.short { border-top: 3px solid var(--red); }

.card-header {
  padding: 13px 14px 8px;
  display: flex; align-items: flex-start; justify-content: space-between;
}
.ticker-name { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; line-height: 1; }
.ticker-sub { font-size: 11px; color: var(--muted); margin-top: 3px; }
.dir-badge { padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: 700; }
.dir-badge.long  { background: rgba(34,197,94,0.15); color: var(--green); }
.dir-badge.short { background: rgba(239,68,68,0.15); color: var(--red); }

/* ── P&L block ── */
.pnl-block {
  padding: 10px 14px;
  background: var(--card2);
  display: flex; align-items: baseline; gap: 8px;
}
.pnl-val { font-size: 28px; font-weight: 800; letter-spacing: -1px; }
.pnl-pct { font-size: 13px; font-weight: 600; padding: 2px 7px; border-radius: 5px; }
.pos { color: var(--green); }
.neg { color: var(--red); }
.neutral { color: var(--muted); }
.pos-bg { background: rgba(34,197,94,0.15); }
.neg-bg { background: rgba(239,68,68,0.15); }
.neutral-bg { background: rgba(139,144,160,0.15); }

/* ── Trail badge ── */
.trail-badge-wrap { padding: 0 14px 6px; }
.trail-badge {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 10px; font-weight: 700; color: var(--amber);
  background: rgba(245,158,11,0.15); padding: 3px 8px; border-radius: 5px;
}
.trail-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--amber); animation: blink 1.5s infinite; }

/* ── Progress bar ── */
.progress-section { padding: 6px 14px 4px; }
.progress-header { display: flex; justify-content: space-between; font-size: 10px; color: var(--muted); margin-bottom: 4px; }
.progress-bar { height: 5px; background: var(--border); border-radius: 3px; overflow: hidden; }
.progress-fill { height: 100%; border-radius: 3px; transition: width 0.5s ease; }
.progress-fill.pos { background: linear-gradient(90deg, #16a34a, #22c55e); }
.progress-fill.neg { background: linear-gradient(90deg, #dc2626, #ef4444); }

/* ── Price row ── */
.price-row { padding: 8px 14px; display: flex; gap: 6px; }
.price-cell { flex: 1; background: var(--card2); border-radius: 8px; padding: 7px 9px; }
.price-cell.live-cell { border: 1px solid rgba(99,102,241,0.3); }
.p-label { font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 2px; }
.p-val { font-size: 13px; font-weight: 600; }
.p-live { font-size: 9px; color: #818cf8; font-weight: 600; margin-top: 1px; }

/* ── Info grid ── */
.info-grid { padding: 4px 14px 8px; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.info-cell { background: var(--card2); border-radius: 7px; padding: 7px 9px; }
.i-label { font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 2px; }
.i-val { font-size: 12px; font-weight: 600; }

/* ── Action buttons ── */
.card-actions { padding: 8px 14px 14px; display: flex; gap: 8px; }
.action-btn {
  flex: 1; padding: 9px 6px; border-radius: 9px;
  border: none; font-size: 12px; font-weight: 700;
  cursor: pointer; font-family: inherit;
  display: flex; align-items: center; justify-content: center; gap: 5px;
  transition: opacity 0.15s, transform 0.1s;
  letter-spacing: 0.2px;
}
.action-btn:active { transform: scale(0.97); }
.action-btn:disabled { opacity: 0.45; cursor: default; }
.btn-trail {
  background: rgba(245,158,11,0.18); color: var(--amber);
  border: 1px solid rgba(245,158,11,0.35);
}
.btn-trail.active-trail {
  background: rgba(245,158,11,0.08); color: rgba(245,158,11,0.5);
  border: 1px solid rgba(245,158,11,0.2);
}
.btn-close {
  background: rgba(239,68,68,0.15); color: var(--red);
  border: 1px solid rgba(239,68,68,0.3);
}
.btn-close:hover:not(:disabled) { background: rgba(239,68,68,0.25); }
.btn-trail:hover:not(:disabled):not(.active-trail) { background: rgba(245,158,11,0.28); }

/* ── Toast ── */
.toast {
  position: fixed; bottom: calc(24px + env(safe-area-inset-bottom));
  left: 50%; transform: translateX(-50%) translateY(20px);
  background: #1e2235; border: 1px solid var(--border);
  color: var(--text); padding: 10px 18px; border-radius: 12px;
  font-size: 13px; font-weight: 500; white-space: nowrap;
  opacity: 0; transition: opacity 0.2s, transform 0.2s;
  z-index: 100; pointer-events: none;
  max-width: calc(100vw - 40px); text-overflow: ellipsis; overflow: hidden;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ── Empty state ── */
.empty { text-align: center; padding: 80px 24px; }
.empty-icon { font-size: 48px; margin-bottom: 16px; }
.empty h2 { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
.empty p { color: var(--muted); font-size: 14px; line-height: 1.6; }
.empty a {
  display: inline-block; margin-top: 20px; padding: 10px 24px;
  background: var(--accent); color: white; border-radius: 10px;
  text-decoration: none; font-weight: 600; font-size: 14px;
}

/* ── Loading ── */
.loading { text-align: center; padding: 60px 24px; color: var(--muted); font-size: 14px; }
.spinner {
  width: 30px; height: 30px;
  border: 3px solid var(--border); border-top-color: var(--accent);
  border-radius: 50%; animation: spin 0.8s linear infinite;
  margin: 0 auto 14px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Back link ── */
.back-link {
  position: fixed; bottom: calc(16px + env(safe-area-inset-bottom)); left: 50%;
  transform: translateX(-50%);
  background: var(--card); border: 1px solid var(--border); color: var(--muted);
  padding: 9px 22px; border-radius: 20px; text-decoration: none;
  font-size: 13px; font-weight: 500; backdrop-filter: blur(8px);
  white-space: nowrap;
}
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="live-dot"></div>
    <h1>Active Positions</h1>
  </div>
  <div class="header-right">
    <a href="/index.html">Dashboard →</a>
  </div>
</div>

<div class="summary" id="summary" style="display:none">
  <div class="sum-item">
    <span class="sum-label">Open</span>
    <span class="sum-val" id="sumCount">—</span>
  </div>
  <div class="sum-item">
    <span class="sum-label">Total P&L</span>
    <span class="sum-val" id="sumPnl">—</span>
  </div>
  <div class="sum-item">
    <span class="sum-label">Longs</span>
    <span class="sum-val" id="sumLongs" style="color:var(--green)">—</span>
  </div>
  <div class="sum-item">
    <span class="sum-label">Shorts</span>
    <span class="sum-val" id="sumShorts" style="color:var(--red)">—</span>
  </div>
  <div class="sum-item">
    <span class="sum-label">Trailing</span>
    <span class="sum-val" id="sumTrail" style="color:var(--amber)">—</span>
  </div>
</div>

<div class="refresh-row" id="refreshRow" style="display:none">
  <span><span class="price-badge">LIVE</span> Price every 3s · Data every 5s</span>
  <span id="lastUpdated">—</span>
</div>

<div id="loading" class="loading">
  <div class="spinner"></div>
  Fetching positions…
</div>

<div id="empty" class="empty" style="display:none">
  <div class="empty-icon">🟢</div>
  <h2>No Open Positions</h2>
  <p>All tickers are flat right now.<br>The bot is watching for entries.</p>
  <a href="/index.html">← Back to Dashboard</a>
</div>

<div id="grid" class="grid"></div>

<a href="/index.html" class="back-link" id="backLink" style="display:none">← Apex Dashboard</a>
<div class="toast" id="toast"></div>

<script>
const TICKERS = ['nvda','amd','tsla','nbis','pltr','asts','spcx','eth','btc','sol','aave','coin','doge','mstr','pepe','rklb','mu'];
const CONFIG_API = '/bot_config.json';
const BINANCE_PRICE_URL = 'https://fapi.binance.com/fapi/v1/ticker/price';

// State
let activeSet = new Set();    // ticker IDs currently showing cards
let cardData  = {};           // ticker → last data file content
let livePrices = {};          // ticker → latest Binance price
let pendingActions = new Set(); // tickers with sent actions (suppress button re-enable)

// ── Formatting ────────────────────────────────────────────────────────────────
function fmtPrice(p) {
  if (p == null || isNaN(p)) return '—';
  if (p >= 10000) return p.toLocaleString('en-US', {maximumFractionDigits: 1});
  if (p >= 1000)  return p.toLocaleString('en-US', {maximumFractionDigits: 2});
  if (p >= 100)   return p.toFixed(2);
  if (p >= 10)    return p.toFixed(3);
  return p.toFixed(4);
}
function fmtPnl(n) {
  if (n == null || isNaN(n)) return '—';
  return (n >= 0 ? '+' : '') + '$' + n.toFixed(2);
}
function fmtPct(n) {
  if (n == null || isNaN(n)) return '';
  return (n >= 0 ? '+' : '') + n.toFixed(1) + '%';
}
function timeSince(iso) {
  if (!iso) return '—';
  const s = (Date.now() - new Date(iso).getTime()) / 1000;
  if (s < 60) return Math.round(s) + 's';
  if (s < 3600) return Math.round(s/60) + 'm';
  if (s < 86400) return Math.round(s/3600) + 'h ' + Math.round((s%3600)/60) + 'm';
  return Math.round(s/86400) + 'd';
}

function calcPnlPct(data, livePrice) {
  const price  = livePrice ?? data.price;
  const entry  = data.trail?.entry_price;
  const pos    = data.position;
  const amount = data.trade_amount || 0;
  const lev    = data.leverage || 1;
  // If bot gave us unrealized_pnl and we're using file price, use that
  if (!livePrice && data.unrealized_pnl != null && amount > 0) {
    return (data.unrealized_pnl / (amount * lev)) * 100;
  }
  if (!entry || !price || !pos) return null;
  const move = pos === 'LONG' ? (price - entry) / entry : (entry - price) / entry;
  return move * lev * 100;
}

function calcLivePnl(data, livePrice) {
  if (!livePrice) return data.unrealized_pnl;
  const entry  = data.trail?.entry_price;
  const pos    = data.position;
  const amount = data.trade_amount || 0;
  const lev    = data.leverage || 1;
  if (!entry || !pos || !amount) return data.unrealized_pnl;
  const move = pos === 'LONG' ? (livePrice - entry) / entry : (entry - livePrice) / entry;
  return move * lev * amount;
}

function trailProgress(data) {
  const entry = data.trail?.entry_price;
  const best  = data.trail?.best_price;
  const sl    = data.trail?.sl;
  const pos   = data.position;
  if (!entry || !best || !sl || !pos) return null;
  const range = pos === 'LONG' ? (best - sl) : (sl - best);
  if (range <= 0) return null;
  const curr  = pos === 'LONG' ? (best - entry) : (entry - best);
  return Math.min(100, Math.max(0, (curr / range) * 100));
}

// ── Toast ─────────────────────────────────────────────────────────────────────
let toastTimer;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 3500);
}

// ── Config API (for close / trail) ───────────────────────────────────────────
async function writeConfig(patch) {
  const r = await fetch(CONFIG_API + '?t=' + Date.now(), {cache:'no-store'});
  const cur = r.ok ? await r.json() : {};
  const up = Object.assign({}, cur, patch, {updated_at: new Date().toISOString()});
  const wr = await fetch(CONFIG_API, {
    method: 'PUT',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify(up, null, 2)
  });
  if (!wr.ok) throw new Error('Server ' + wr.status);
}

async function requestTrail(sym) {
  const btn = document.getElementById('trail-btn-' + sym);
  if (btn) { btn.disabled = true; btn.innerHTML = '⏳ Sending…'; }
  try {
    await writeConfig({
      futures_force_trail: true,
      futures_force_trail_at: new Date().toISOString(),
      futures_force_trail_symbol: sym + 'USDT'
    });
    showToast('🔒 Trail locked for ' + sym + ' — activates next cycle (~30s)');
    pendingActions.add(sym);
    if (btn) { btn.innerHTML = '🔒 Trail Sent'; }
  } catch(e) {
    showToast('⚠️ Trail failed: ' + e.message);
    if (btn) { btn.disabled = false; btn.innerHTML = '🔒 Lock Trail'; }
  }
}

async function requestClose(sym) {
  if (!confirm('Close ' + sym + ' position at market now?\n\nThis executes within 30 seconds.')) return;
  const btn = document.getElementById('close-btn-' + sym);
  if (btn) { btn.disabled = true; btn.innerHTML = '⏳ Sending…'; }
  try {
    await writeConfig({
      futures_close_requested: true,
      futures_close_requested_at: new Date().toISOString(),
      futures_close_symbol: sym + 'USDT'
    });
    showToast('✅ Close sent for ' + sym + ' — executes within 30s');
    pendingActions.add(sym);
    if (btn) { btn.innerHTML = '✅ Close Sent'; }
  } catch(e) {
    showToast('⚠️ Close failed: ' + e.message);
    if (btn) { btn.disabled = false; btn.innerHTML = '✕ Close Now'; }
  }
}

// ── Build a card element (first render) ───────────────────────────────────────
function buildCard(data) {
  const sym   = data.symbol.replace('USDT','');
  const pos   = data.position;
  const isLong = pos === 'LONG';
  const live  = livePrices[sym];
  const price = live ?? data.price;
  const entry = data.trail?.entry_price;
  const trailActive = data.trail?.active;
  const trailStop   = data.trail?.trail_stop;
  const hardSl      = data.trail?.sl;
  const best        = data.trail?.best_price;
  const pnl         = calcLivePnl(data, live);
  const pct         = calcPnlPct(data, live);
  const prog        = trailProgress(data);
  const pnlClass    = pnl > 0 ? 'pos' : pnl < 0 ? 'neg' : 'neutral';
  const pnlBg       = pnl > 0 ? 'pos-bg' : pnl < 0 ? 'neg-bg' : 'neutral-bg';
  const moveStr     = (entry && price && pos)
    ? fmtPct(isLong ? (price-entry)/entry*100 : (entry-price)/entry*100)
    : '—';
  const activeSl    = trailActive ? trailStop : hardSl;

  const c = document.createElement('div');
  c.className = 'pos-card ' + pos.toLowerCase();
  c.dataset.sym = sym;

  c.innerHTML = `
    <div class="card-header">
      <div>
        <div class="ticker-name">${sym}</div>
        <div class="ticker-sub" id="tsub-${sym}">${data.leverage}x · $${data.trade_amount} · ${timeSince(data.trade_opened_at)} in trade</div>
      </div>
      <span class="dir-badge ${pos.toLowerCase()}">${pos}</span>
    </div>

    <div class="pnl-block" id="pnl-block-${sym}">
      <div class="pnl-val ${pnlClass}" id="pnl-val-${sym}">${fmtPnl(pnl)}</div>
      ${pct !== null ? `<span class="pnl-pct ${pnlClass} ${pnlBg}" id="pnl-pct-${sym}">${fmtPct(pct)}</span>` : ''}
    </div>

    <div id="trail-badge-${sym}" class="trail-badge-wrap" style="${trailActive ? '' : 'display:none'}">
      <span class="trail-badge">
        <span class="trail-dot"></span>
        TRAILING ACTIVE · best <span id="trail-best-${sym}">${fmtPrice(best)}</span>
      </span>
    </div>

    <div id="prog-section-${sym}" class="progress-section" style="${prog !== null ? '' : 'display:none'}">
      <div class="progress-header">
        <span>SL <span id="prog-sl-${sym}">${fmtPrice(hardSl)}</span></span>
        <span id="prog-pct-${sym}">${prog !== null ? prog.toFixed(0)+'% of range' : ''}</span>
        <span>Best <span id="prog-best-${sym}">${fmtPrice(best)}</span></span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill ${pnl >= 0 ? 'pos' : 'neg'}" id="prog-fill-${sym}" style="width:${prog ?? 0}%"></div>
      </div>
    </div>

    <div class="price-row">
      <div class="price-cell">
        <div class="p-label">Entry</div>
        <div class="p-val" id="price-entry-${sym}">${fmtPrice(entry)}</div>
      </div>
      <div class="price-cell live-cell">
        <div class="p-label">Now <span class="price-badge" style="font-size:8px">LIVE</span></div>
        <div class="p-val" id="price-now-${sym}">${fmtPrice(price)}</div>
      </div>
      <div class="price-cell">
        <div class="p-label">Move</div>
        <div class="p-val ${pnlClass}" id="price-move-${sym}">${moveStr}</div>
      </div>
    </div>

    <div class="info-grid">
      <div class="info-cell">
        <div class="i-label">Active Stop</div>
        <div class="i-val" style="color:var(--red)" id="stop-active-${sym}">${fmtPrice(activeSl)}</div>
      </div>
      <div class="info-cell">
        <div class="i-label">Hard SL</div>
        <div class="i-val" id="stop-hard-${sym}">${fmtPrice(hardSl)}</div>
      </div>
      <div class="info-cell">
        <div class="i-label">Regime</div>
        <div class="i-val">${data.regime || '—'}</div>
      </div>
      <div class="info-cell">
        <div class="i-label">Status</div>
        <div class="i-val" style="font-size:11px">${data.action || '—'}</div>
      </div>
    </div>

    <div class="card-actions">
      <button class="action-btn btn-trail${trailActive ? ' active-trail' : ''}"
              id="trail-btn-${sym}"
              ${trailActive ? 'disabled' : ''}
              onclick="requestTrail('${sym}')">
        ${trailActive ? '🔒 Trailing Active' : '🔒 Lock Trail'}
      </button>
      <button class="action-btn btn-close"
              id="close-btn-${sym}"
              onclick="requestClose('${sym}')">
        ✕ Close Now
      </button>
    </div>
  `;
  return c;
}

// ── Update an existing card in-place (no flicker) ────────────────────────────
function updateCard(sym, data) {
  const live   = livePrices[sym];
  const price  = live ?? data.price;
  const entry  = data.trail?.entry_price;
  const pos    = data.position;
  const isLong = pos === 'LONG';
  const trailActive = data.trail?.active;
  const trailStop   = data.trail?.trail_stop;
  const hardSl      = data.trail?.sl;
  const best        = data.trail?.best_price;
  const pnl         = calcLivePnl(data, live);
  const pct         = calcPnlPct(data, live);
  const prog        = trailProgress(data);
  const pnlClass    = pnl > 0 ? 'pos' : pnl < 0 ? 'neg' : 'neutral';
  const pnlBg       = pnl > 0 ? 'pos-bg' : pnl < 0 ? 'neg-bg' : 'neutral-bg';
  const moveStr     = (entry && price && pos)
    ? fmtPct(isLong ? (price-entry)/entry*100 : (entry-price)/entry*100)
    : '—';
  const activeSl = trailActive ? trailStop : hardSl;

  function setText(id, val) {
    const el = document.getElementById(id);
    if (el && el.textContent !== val) el.textContent = val;
  }
  function setClass(id, cls) {
    const el = document.getElementById(id);
    if (el) el.className = cls;
  }
  function show(id, visible) {
    const el = document.getElementById(id);
    if (el) el.style.display = visible ? '' : 'none';
  }

  setText('pnl-val-'+sym, fmtPnl(pnl));
  setClass('pnl-val-'+sym, 'pnl-val '+pnlClass);
  const pctEl = document.getElementById('pnl-pct-'+sym);
  if (pctEl) { setText('pnl-pct-'+sym, fmtPct(pct)); setClass('pnl-pct-'+sym, 'pnl-pct '+pnlClass+' '+pnlBg); }

  setText('price-now-'+sym, fmtPrice(price));
  setText('price-move-'+sym, moveStr);
  setClass('price-move-'+sym, 'p-val '+pnlClass);

  // Trail badge
  show('trail-badge-'+sym, !!trailActive);
  setText('trail-best-'+sym, fmtPrice(best));

  // Progress bar
  show('prog-section-'+sym, prog !== null);
  if (prog !== null) {
    setText('prog-sl-'+sym,   fmtPrice(hardSl));
    setText('prog-pct-'+sym,  prog.toFixed(0)+'% of range');
    setText('prog-best-'+sym, fmtPrice(best));
    const fill = document.getElementById('prog-fill-'+sym);
    if (fill) { fill.style.width = prog+'%'; fill.className = 'progress-fill '+(pnl>=0?'pos':'neg'); }
  }

  // Stops
  setText('stop-active-'+sym, fmtPrice(activeSl));
  setText('stop-hard-'+sym,   fmtPrice(hardSl));

  // Trail button — update if not pending
  if (!pendingActions.has(sym)) {
    const trailBtn = document.getElementById('trail-btn-'+sym);
    if (trailBtn) {
      trailBtn.disabled = !!trailActive;
      trailBtn.innerHTML = trailActive ? '🔒 Trailing Active' : '🔒 Lock Trail';
      trailBtn.className = 'action-btn btn-trail' + (trailActive ? ' active-trail' : '');
    }
  }

  // Time in trade
  const tsub = document.getElementById('tsub-'+sym);
  if (tsub) tsub.textContent = `${data.leverage}x · $${data.trade_amount} · ${timeSince(data.trade_opened_at)} in trade`;
}

// ── Live price fetch from Binance ─────────────────────────────────────────────
async function fetchLivePrices() {
  if (activeSet.size === 0) return;
  const symbols = Array.from(activeSet).map(t => `"${t}USDT"`);
  try {
    const url = BINANCE_PRICE_URL + '?symbols=[' + symbols.join(',') + ']';
    const r = await fetch(url, {cache:'no-store'});
    if (!r.ok) return;
    const list = await r.json();
    list.forEach(item => {
      const sym = item.symbol.replace('USDT','');
      const p = parseFloat(item.price);
      if (!isNaN(p)) livePrices[sym] = p;
    });
    // Update price cells and P&L for all active cards
    activeSet.forEach(sym => {
      if (cardData[sym]) updateCard(sym, cardData[sym]);
    });
    updateSummary();
  } catch(e) {} // silently ignore — data files are fallback
}

// ── Update summary bar ────────────────────────────────────────────────────────
function updateSummary() {
  const active = Array.from(activeSet).map(s => cardData[s]).filter(Boolean);
  const totalPnl = active.reduce((sum, d) => {
    return sum + (calcLivePnl(d, livePrices[d.symbol.replace('USDT','')]) || 0);
  }, 0);
  const longs  = active.filter(d => d.position === 'LONG').length;
  const shorts = active.filter(d => d.position === 'SHORT').length;
  const trails = active.filter(d => d.trail?.active).length;

  const pnlEl = document.getElementById('sumPnl');
  if (pnlEl) {
    pnlEl.textContent = fmtPnl(totalPnl);
    pnlEl.style.color = totalPnl >= 0 ? 'var(--green)' : 'var(--red)';
  }
  const ct = document.getElementById('sumCount'); if(ct) ct.textContent = active.length;
  const sl = document.getElementById('sumLongs'); if(sl) sl.textContent = longs;
  const ss = document.getElementById('sumShorts'); if(ss) ss.textContent = shorts;
  const st = document.getElementById('sumTrail'); if(st) st.textContent = trails > 0 ? trails+' ✓' : '—';
}

// ── Main data load (every 5s) ─────────────────────────────────────────────────
async function safeFetch(url) {
  try {
    const r = await fetch(url + '?t=' + Date.now(), {cache:'no-store'});
    return r.ok ? await r.json() : null;
  } catch { return null; }
}

async function loadAll() {
  const results = await Promise.all(TICKERS.map(t => safeFetch('/data_futures_' + t + '.json')));
  const active = results.filter(d => d && d.position);

  document.getElementById('loading').style.display = 'none';

  if (active.length === 0) {
    document.getElementById('empty').style.display    = 'block';
    document.getElementById('summary').style.display  = 'none';
    document.getElementById('refreshRow').style.display = 'none';
    document.getElementById('backLink').style.display = 'none';
    document.getElementById('grid').innerHTML = '';
    activeSet.clear(); cardData = {};
    return;
  }

  document.getElementById('empty').style.display    = 'none';
  document.getElementById('summary').style.display  = 'flex';
  document.getElementById('refreshRow').style.display = 'flex';
  document.getElementById('backLink').style.display = 'flex';
  document.getElementById('lastUpdated').textContent = new Date().toLocaleTimeString();

  const newSet = new Set(active.map(d => d.symbol.replace('USDT','')));

  // Detect if the set of active tickers changed → rebuild cards
  const setsMatch = newSet.size === activeSet.size && [...newSet].every(s => activeSet.has(s));

  if (!setsMatch) {
    // Sort by P&L descending, rebuild grid
    active.sort((a,b) => (b.unrealized_pnl||0) - (a.unrealized_pnl||0));
    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    activeSet = newSet;
    active.forEach(d => {
      const sym = d.symbol.replace('USDT','');
      cardData[sym] = d;
      grid.appendChild(buildCard(d));
    });
  } else {
    // In-place update
    active.forEach(d => {
      const sym = d.symbol.replace('USDT','');
      cardData[sym] = d;
      updateCard(sym, d);
    });
  }

  updateSummary();
}

// ── Boot ──────────────────────────────────────────────────────────────────────
loadAll();
setInterval(loadAll, 5000);         // data files: every 5s
setInterval(fetchLivePrices, 3000); // live price: every 3s
</script>
