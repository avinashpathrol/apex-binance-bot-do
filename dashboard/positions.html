<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Apex — Active Positions</title>
<style>
:root {
  --bg: #0f1117;
  --card: #1a1d27;
  --card2: #222635;
  --border: #2e3347;
  --text: #e8eaf0;
  --muted: #8b90a0;
  --green: #22c55e;
  --red: #ef4444;
  --amber: #f59e0b;
  --blue: #3b82f6;
  --purple: #a855f7;
  --accent: #6366f1;
  font-size: 15px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
  min-height: 100vh;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}

/* Header */
.header {
  background: var(--card);
  border-bottom: 1px solid var(--border);
  padding: 14px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 10;
}
.header-left { display: flex; align-items: center; gap: 10px; }
.header h1 { font-size: 18px; font-weight: 700; letter-spacing: -0.3px; }
.header a { color: var(--muted); font-size: 13px; text-decoration: none; }
.header a:hover { color: var(--text); }
.live-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--green);
  animation: pulse 2s infinite;
}
@keyframes pulse {
  0%,100% { opacity: 1; }
  50% { opacity: 0.4; }
}

/* Summary bar */
.summary {
  background: var(--card2);
  border-bottom: 1px solid var(--border);
  padding: 10px 16px;
  display: flex;
  gap: 20px;
  align-items: center;
  font-size: 13px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}
.summary-item { display: flex; flex-direction: column; gap: 2px; white-space: nowrap; }
.summary-label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
.summary-val { font-weight: 700; font-size: 15px; }

/* Refresh */
.refresh-row {
  padding: 8px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 12px;
  color: var(--muted);
}
.refresh-btn {
  background: none;
  border: 1px solid var(--border);
  color: var(--muted);
  padding: 4px 10px;
  border-radius: 6px;
  font-size: 12px;
  cursor: pointer;
}
.refresh-btn:hover { border-color: var(--accent); color: var(--accent); }

/* Cards grid */
.grid {
  padding: 4px 12px 80px;
  display: grid;
  grid-template-columns: 1fr;
  gap: 12px;
}
@media (min-width: 640px) {
  .grid { grid-template-columns: 1fr 1fr; }
}
@media (min-width: 1024px) {
  .grid { grid-template-columns: 1fr 1fr 1fr; }
}

/* Card */
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  overflow: hidden;
  position: relative;
}
.card.long { border-top: 3px solid var(--green); }
.card.short { border-top: 3px solid var(--red); }

.card-header {
  padding: 14px 16px 10px;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
}
.ticker-name {
  font-size: 22px;
  font-weight: 800;
  letter-spacing: -0.5px;
  line-height: 1;
}
.ticker-sub { font-size: 11px; color: var(--muted); margin-top: 3px; }

.dir-badge {
  padding: 4px 10px;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.5px;
}
.dir-badge.long { background: rgba(34,197,94,0.15); color: var(--green); }
.dir-badge.short { background: rgba(239,68,68,0.15); color: var(--red); }

/* PnL block */
.pnl-block {
  padding: 10px 16px;
  background: var(--card2);
  display: flex;
  align-items: baseline;
  gap: 8px;
}
.pnl-val {
  font-size: 28px;
  font-weight: 800;
  letter-spacing: -1px;
}
.pnl-pct {
  font-size: 14px;
  font-weight: 600;
  padding: 2px 7px;
  border-radius: 5px;
}
.pos { color: var(--green); }
.neg { color: var(--red); }
.neutral { color: var(--muted); }
.pos-bg { background: rgba(34,197,94,0.15); }
.neg-bg { background: rgba(239,68,68,0.15); }
.neutral-bg { background: rgba(139,144,160,0.15); }

/* Price row */
.price-row {
  padding: 10px 16px;
  display: flex;
  gap: 8px;
}
.price-cell {
  flex: 1;
  background: var(--card2);
  border-radius: 8px;
  padding: 8px 10px;
}
.price-cell-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 3px; }
.price-cell-val { font-size: 14px; font-weight: 600; }

/* Progress bar (trail to target) */
.trail-section {
  padding: 10px 16px;
}
.trail-header {
  display: flex;
  justify-content: space-between;
  font-size: 11px;
  color: var(--muted);
  margin-bottom: 5px;
}
.progress-bar {
  height: 6px;
  background: var(--border);
  border-radius: 3px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  border-radius: 3px;
  transition: width 0.4s ease;
}
.progress-fill.pos { background: linear-gradient(90deg, #16a34a, #22c55e); }
.progress-fill.neg { background: linear-gradient(90deg, #dc2626, #ef4444); }

/* Info grid */
.info-grid {
  padding: 10px 16px 14px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.info-cell {
  background: var(--card2);
  border-radius: 8px;
  padding: 8px 10px;
}
.info-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 3px; }
.info-val { font-size: 13px; font-weight: 600; }

/* Trail active badge */
.trail-active {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 10px;
  font-weight: 600;
  color: var(--amber);
  background: rgba(245,158,11,0.15);
  padding: 2px 7px;
  border-radius: 4px;
  margin: 0 16px 10px;
}
.trail-dot {
  width: 5px; height: 5px;
  border-radius: 50%;
  background: var(--amber);
  animation: pulse 1.5s infinite;
}

/* Empty state */
.empty {
  text-align: center;
  padding: 80px 24px;
}
.empty-icon { font-size: 48px; margin-bottom: 16px; }
.empty h2 { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
.empty p { color: var(--muted); font-size: 14px; line-height: 1.5; }
.empty a {
  display: inline-block;
  margin-top: 20px;
  padding: 10px 24px;
  background: var(--accent);
  color: white;
  border-radius: 10px;
  text-decoration: none;
  font-weight: 600;
  font-size: 14px;
}

/* Loading */
.loading {
  text-align: center;
  padding: 60px 24px;
  color: var(--muted);
  font-size: 14px;
}
.spinner {
  width: 32px; height: 32px;
  border: 3px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin: 0 auto 16px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Footer link */
.back-link {
  position: fixed;
  bottom: calc(16px + env(safe-area-inset-bottom));
  left: 50%;
  transform: translateX(-50%);
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--muted);
  padding: 10px 24px;
  border-radius: 20px;
  text-decoration: none;
  font-size: 13px;
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: 6px;
  backdrop-filter: blur(8px);
  white-space: nowrap;
}
.back-link:hover { border-color: var(--accent); color: var(--accent); }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="live-dot"></div>
    <h1>Active Positions</h1>
  </div>
  <a href="/index.html">Dashboard →</a>
</div>

<div class="summary" id="summary" style="display:none">
  <div class="summary-item">
    <span class="summary-label">Open</span>
    <span class="summary-val" id="sumCount">—</span>
  </div>
  <div class="summary-item">
    <span class="summary-label">Total P&L</span>
    <span class="summary-val" id="sumPnl">—</span>
  </div>
  <div class="summary-item">
    <span class="summary-label">Longs</span>
    <span class="summary-val" id="sumLongs" style="color:var(--green)">—</span>
  </div>
  <div class="summary-item">
    <span class="summary-label">Shorts</span>
    <span class="summary-val" id="sumShorts" style="color:var(--red)">—</span>
  </div>
  <div class="summary-item">
    <span class="summary-label">Trail Active</span>
    <span class="summary-val" id="sumTrail" style="color:var(--amber)">—</span>
  </div>
</div>

<div class="refresh-row" id="refreshRow" style="display:none">
  <span id="lastUpdated">—</span>
  <button class="refresh-btn" onclick="loadAll()">⟳ Refresh</button>
</div>

<div id="loading" class="loading">
  <div class="spinner"></div>
  Fetching positions…
</div>

<div id="empty" class="empty" style="display:none">
  <div class="empty-icon">🟢</div>
  <h2>No Open Positions</h2>
  <p>All tickers are flat right now.<br>The bot is watching for entries.</p>
  <a href="/index.html">← Back to Dashboard</a>
</div>

<div id="grid" class="grid"></div>

<a href="/index.html" class="back-link" id="backLink" style="display:none">← Apex Dashboard</a>

<script>
const TICKERS = [
  'nvda','amd','tsla','nbis','pltr','asts','spcx','eth','btc','sol',
  'aave','coin','doge','mstr','pepe','rklb','mu'
];
const API_BASE = '';

function fmt(n, dec=2) {
  if (n === null || n === undefined || isNaN(n)) return '—';
  return n.toFixed(dec);
}

function fmtPrice(p) {
  if (!p && p !== 0) return '—';
  if (p >= 1000) return p.toLocaleString('en-US', {maximumFractionDigits: 2});
  if (p >= 100) return p.toFixed(2);
  if (p >= 10) return p.toFixed(3);
  return p.toFixed(4);
}

function fmtPnl(n) {
  if (n === null || n === undefined || isNaN(n)) return '—';
  const sign = n >= 0 ? '+' : '';
  return `${sign}$${n.toFixed(2)}`;
}

function timeSince(isoStr) {
  if (!isoStr) return '—';
  const d = new Date(isoStr);
  const diff = (Date.now() - d.getTime()) / 1000;
  if (diff < 60) return `${Math.round(diff)}s ago`;
  if (diff < 3600) return `${Math.round(diff/60)}m ago`;
  if (diff < 86400) return `${Math.round(diff/3600)}h ago`;
  return `${Math.round(diff/86400)}d ago`;
}

function pnlPct(data) {
  const entry = data.trail?.entry_price;
  const price = data.price;
  const pnl = data.unrealized_pnl;
  const pos = data.position;
  const amount = data.trade_amount || 0;
  const lev = data.leverage || 1;
  if (pnl !== null && pnl !== undefined && amount > 0) {
    const max = amount * lev * 0.05; // rough: SL at ~5%
    return (pnl / (amount * lev)) * 100;
  }
  if (!entry || !price || !pos) return null;
  const move = pos === 'LONG' ? (price - entry) / entry : (entry - price) / entry;
  return move * lev * 100;
}

function trailProgress(data) {
  const entry = data.trail?.entry_price;
  const best = data.trail?.best_price;
  const sl = data.trail?.sl;
  const pos = data.position;
  if (!entry || !best || !sl || !pos) return null;
  const totalRange = pos === 'LONG' ? (best - sl) : (sl - best);
  if (totalRange <= 0) return null;
  const current = pos === 'LONG' ? (best - entry) : (entry - best);
  return Math.min(100, Math.max(0, (current / totalRange) * 100));
}

function buildCard(data) {
  const sym = data.symbol.replace('USDT','');
  const pos = data.position; // 'LONG' or 'SHORT'
  const isLong = pos === 'LONG';
  const pnl = data.unrealized_pnl;
  const entry = data.trail?.entry_price;
  const price = data.price;
  const trailActive = data.trail?.active;
  const trailStop = data.trail?.trail_stop;
  const hardSl = data.trail?.sl;
  const best = data.trail?.best_price;
  const pct = pnlPct(data);
  const prog = trailProgress(data);

  const pnlClass = pnl > 0 ? 'pos' : pnl < 0 ? 'neg' : 'neutral';
  const pnlBg = pnl > 0 ? 'pos-bg' : pnl < 0 ? 'neg-bg' : 'neutral-bg';
  const pctStr = pct !== null ? `${pct >= 0 ? '+' : ''}${pct.toFixed(1)}%` : '';

  // Move % entry→current
  let moveStr = '—';
  if (entry && price && pos) {
    const movePct = isLong ? ((price - entry) / entry * 100) : ((entry - price) / entry * 100);
    moveStr = `${movePct >= 0 ? '+' : ''}${movePct.toFixed(2)}%`;
  }

  const card = document.createElement('div');
  card.className = `card ${pos.toLowerCase()}`;
  card.dataset.sym = sym;

  card.innerHTML = `
    <div class="card-header">
      <div>
        <div class="ticker-name">${sym}</div>
        <div class="ticker-sub">${data.leverage}x · $${data.trade_amount} · ${timeSince(data.trade_opened_at)}</div>
      </div>
      <span class="dir-badge ${pos.toLowerCase()}">${pos}</span>
    </div>

    <div class="pnl-block">
      <div class="pnl-val ${pnlClass}">${fmtPnl(pnl)}</div>
      ${pctStr ? `<span class="pnl-pct ${pnlClass} ${pnlBg}">${pctStr}</span>` : ''}
    </div>

    ${trailActive ? `
    <div style="padding:0 16px 4px">
      <span class="trail-active">
        <span class="trail-dot"></span>
        TRAILING ACTIVE · best ${fmtPrice(best)}
      </span>
    </div>` : ''}

    ${prog !== null ? `
    <div class="trail-section">
      <div class="trail-header">
        <span>SL ${fmtPrice(hardSl)}</span>
        <span>${prog.toFixed(0)}% of range</span>
        <span>Best ${fmtPrice(best)}</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill ${pnl >= 0 ? 'pos' : 'neg'}" style="width:${prog}%"></div>
      </div>
    </div>` : ''}

    <div class="price-row">
      <div class="price-cell">
        <div class="price-cell-label">Entry</div>
        <div class="price-cell-val">${fmtPrice(entry)}</div>
      </div>
      <div class="price-cell">
        <div class="price-cell-label">Now</div>
        <div class="price-cell-val">${fmtPrice(price)}</div>
      </div>
      <div class="price-cell">
        <div class="price-cell-label">Move</div>
        <div class="price-cell-val ${pnl >= 0 ? 'pos' : 'neg'}">${moveStr}</div>
      </div>
    </div>

    <div class="info-grid">
      <div class="info-cell">
        <div class="info-label">Stop Loss</div>
        <div class="info-val" style="color:var(--red)">${fmtPrice(trailActive ? trailStop : hardSl)}</div>
      </div>
      <div class="info-cell">
        <div class="info-label">Hard SL</div>
        <div class="info-val">${fmtPrice(hardSl)}</div>
      </div>
      <div class="info-cell">
        <div class="info-label">Regime</div>
        <div class="info-val">${data.regime || '—'}</div>
      </div>
      <div class="info-cell">
        <div class="info-label">Action</div>
        <div class="info-val">${data.action || '—'}</div>
      </div>
    </div>
  `;

  return card;
}

async function safeFetch(url) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 6000);
  try {
    const r = await fetch(url, { signal: ctrl.signal });
    clearTimeout(timer);
    if (!r.ok) return null;
    return await r.json();
  } catch {
    clearTimeout(timer);
    return null;
  }
}

async function loadAll() {
  const fetches = TICKERS.map(t => safeFetch(`/data_futures_${t}.json`));
  const results = await Promise.all(fetches);

  const active = results.filter(d => d && d.position);

  document.getElementById('loading').style.display = 'none';

  const grid = document.getElementById('grid');
  grid.innerHTML = '';

  if (active.length === 0) {
    document.getElementById('empty').style.display = 'block';
    document.getElementById('summary').style.display = 'none';
    document.getElementById('refreshRow').style.display = 'none';
    document.getElementById('backLink').style.display = 'none';
    return;
  }

  document.getElementById('empty').style.display = 'none';
  document.getElementById('summary').style.display = 'flex';
  document.getElementById('refreshRow').style.display = 'flex';
  document.getElementById('backLink').style.display = 'flex';

  // Summary
  const totalPnl = active.reduce((s, d) => s + (d.unrealized_pnl || 0), 0);
  const longs = active.filter(d => d.position === 'LONG').length;
  const shorts = active.filter(d => d.position === 'SHORT').length;
  const trails = active.filter(d => d.trail?.active).length;

  document.getElementById('sumCount').textContent = active.length;
  const pnlEl = document.getElementById('sumPnl');
  pnlEl.textContent = fmtPnl(totalPnl);
  pnlEl.style.color = totalPnl >= 0 ? 'var(--green)' : 'var(--red)';
  document.getElementById('sumLongs').textContent = longs;
  document.getElementById('sumShorts').textContent = shorts;
  document.getElementById('sumTrail').textContent = trails > 0 ? `${trails} ✓` : '—';
  document.getElementById('lastUpdated').textContent = `Updated ${new Date().toLocaleTimeString()}`;

  // Sort: most profitable first
  active.sort((a, b) => (b.unrealized_pnl || 0) - (a.unrealized_pnl || 0));
  active.forEach(d => grid.appendChild(buildCard(d)));
}

// Auto-refresh every 30s
loadAll();
setInterval(loadAll, 30000);

// Tick time-since labels every minute
setInterval(() => {
  document.querySelectorAll('.ticker-sub').forEach(el => {
    // re-render timing: just reload
  });
}, 60000);
</script>
</body>
</html>
